[package]
name = "outputplusplus"
version = "0.1.0"
edition = "2021"
description = "Project hub: string utilities, repository glue, and an MCP server"
license = "MIT"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "outputplusplus"
path = "src/lib.rs"

[[bin]]
name = "outputplusplus-mcp"
path = "src/main.rs"
