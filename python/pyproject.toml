[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outputplusplus"
version = "0.1.0"
description = "Supercharge your strings. A totally normal, definitely-not-cursed utility library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "outputplusplus maintainers" }]
keywords = ["strings", "utilities", "text", "pain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
opp = "outputplusplus.cli:cli"

[project.urls]
Homepage = "https://github.com/example/outputplusplus"
Issues = "https://github.com/example/outputplusplus/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/outputplusplus"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "PL"]
ignore = [
    "S101",    # asserts are used throughout the test suite
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLW0603", # module-level globals are intentional (see AGENTS.md)
    "B008",    # function calls in defaults are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# The science stack is stable enough that stubs are a formality here.
module = ["matplotlib.*", "sklearn.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=outputplusplus --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
branch = true
source = ["src/outputplusplus"]
